<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>    
      class Producto {
        constructor(codigo, nombre, cantidad, costo) {
            this.codigo = codigo;
            this.nombre = nombre;
            this.cantidad = cantidad;
            this.costo = costo;
  }

     info() {
         return `Código: ${this.codigo} | Nombre: ${this.nombre} | Cantidad: ${this.cantidad} | Costo: $${this.costo}`;
  }
}

     class Inventario {
        constructor() {
            this.productos = [];
  }

  agregar(nuevo) {
    this.productos.push(nuevo);
  }

  agregarInicio(nuevo) {
    for (let i = this.productos.length; i > 0; i--) {
      this.productos[i] = this.productos[i - 1];
    }
    this.productos[0] = nuevo;
  }

  buscar(codigo) {
    for (let i = 0; i < this.productos.length; i++) {
      if (this.productos[i].codigo === codigo) {
        return this.productos[i];
      }
    }
    return null;
  }

  eliminar(codigo) {
    let pos = -1;
    for (let i = 0; i < this.productos.length; i++) {
      if (this.productos[i].codigo === codigo) {
        pos = i;
        break;
      }
    }

    if (pos !== -1) {
      for (let i = pos; i < this.productos.length - 1; i++) {
        this.productos[i] = this.productos[i + 1];
      }
      return this.productos.pop();
    }
    return null;
  }

  extraerPrimero() {
    if (this.productos.length === 0) {
      return null;
    }

    let primero = this.productos[0];

    for (let i = 0; i < this.productos.length - 1; i++) {
      this.productos[i] = this.productos[i + 1];
    }

    this.productos.pop();
    return primero;
  }

  listar() {
    let res = "";
    for (let i = 0; i < this.productos.length; i++) {
      res += this.productos[i].info() + "\n";
    }
    return res;
  }
}

let inventario = new Inventario();
let nuevo = new Producto(1, "Lapiz", 100, 10); 
inventario.agregar(nuevo);
nuevo = new Producto(2, "Borrador", 200, 20);
inventario.agregar(nuevo);
nuevo = new Producto(3, "Cuaderno", 300, 30);
inventario.agregar(nuevo);
nuevo = new Producto(4, "Clips", 20, 10);
inventario.agregarInicio(nuevo);
nuevo = new Producto(5, "Sacapuntas", 500, 50);
inventario.agregar(nuevo);

console.log(inventario.listar());

inventario.eliminar(3);

console.log(inventario.listar());

let res = inventario.buscar(10);
if (res == null)
  console.log("No existe");
else
  console.log("si existe");

res = inventario.buscar(4);
if (res == null)
  console.log("No existe");
else
  console.log(res.info());

res = inventario.extraerPrimero();
console.log("el primero es");
console.log(res.info());
    </script>
</body>
</html>
